<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>Ozzy — Choose what to share</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, "Segoe UI", sans-serif; color: #172033; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px; background: #f8fafc; }
    h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.03em; }
    p { color: #64748b; font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
    #sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .source { border: 1px solid #dbe2ea; border-radius: 14px; padding: 10px; background: white; text-align: left; cursor: pointer; transition: border-color .12s, transform .12s, box-shadow .12s; }
    .source:hover { border-color: #6366f1; transform: translateY(-1px); box-shadow: 0 6px 22px #17203312; }
    .source:focus-visible { outline: 3px solid #818cf8; outline-offset: 2px; }
    .source img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #0f172a; border-radius: 8px; }
    .source span { display: block; margin-top: 9px; font-size: 12px; font-weight: 750; overflow-wrap: anywhere; }
    .empty { padding: 20px; background: white; color: #64748b; border-radius: 12px; grid-column: 1/-1; font-size: 13px; }
    .footer { position: sticky; bottom: -22px; margin: 18px -22px -22px; display: flex; justify-content: flex-end; gap: 9px; padding: 14px 22px; border-top: 1px solid #e2e8f0; background: #ffffffed; }
    button.cancel { background: #e2e8f0; color: #334155; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 750; cursor: pointer; }
    .busy { opacity: .55; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Choose what Ozzy can see</h1>
  <p>Select a screen or window. Only the selected source is shared, and you can stop sharing at any time inside Ozzy.</p>
  <div id="sources" aria-live="polite"><div class="empty">Loading available screens and windows…</div></div>
  <div class="footer"><button class="cancel" id="cancel-btn">Cancel</button></div>
<script>
(() => {
  const requestId = new URLSearchParams(window.location.search).get('requestId') || '';
  const sourceGrid = document.getElementById('sources');
  const cancelBtn = document.getElementById('cancel-btn');
  let finished = false;

  function showMessage(message) {
    sourceGrid.replaceChildren();
    const node = document.createElement('div');
    node.className = 'empty';
    node.textContent = message;
    sourceGrid.appendChild(node);
  }

  async function loadSources() {
    try {
      const sources = await window.ozzyPicker.listSources(requestId);
      sourceGrid.replaceChildren();
      if (!sources.length) {
        showMessage('No shareable screens or windows were found. Close this dialog and try again.');
        return;
      }
      for (const source of sources) {
        const button = document.createElement('button');
        button.className = 'source';
        button.type = 'button';
        const image = document.createElement('img');
        image.alt = '';
        image.src = source.thumbnail || '';
        const label = document.createElement('span');
        label.textContent = source.name || 'Unnamed window';
        button.append(image, label);
        button.addEventListener('click', async () => {
          if (finished) return;
          finished = true;
          document.body.classList.add('busy');
          const ok = await window.ozzyPicker.chooseSource(requestId, source.id);
          if (!ok) {
            finished = false;
            document.body.classList.remove('busy');
            showMessage('That source could not be selected. Please cancel and try again.');
          }
        });
        sourceGrid.appendChild(button);
      }
    } catch (error) {
      showMessage('Could not load sources: ' + (error.message || String(error)));
    }
  }

  cancelBtn.addEventListener('click', async () => {
    if (finished) return;
    finished = true;
    await window.ozzyPicker.cancel(requestId);
    window.close();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') cancelBtn.click();
  });
  loadSources();
})();
</script>
</body>
</html>
