name: ozzy_mobile
description: Ozzy mobile companion - Gemini Live voice, camera vision, and local approved memories.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  flutter_secure_storage: ^11.2.0
  flutter_soloud: ^5.2.1
  gemini_live: ^2026.10.6
  image_picker: ^1.2.4
  path: ^1.9.1
  record: ^7.1.2
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
